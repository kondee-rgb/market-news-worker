name: 📡 Scout Market Intelligence (24/7 Unlimited)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-market-intel
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --quiet requests yfinance pandas numpy beautifulsoup4 telethon
      - name: Run Scout Dispatcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DEST_CHAT_ID: ${{ secrets.DEST_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: python -u almond_cave/scout_dispatcher.py auto
      - name: Save State
        run: |
          git config user.name "Market Worker Bot"
          git config user.email "worker@users.noreply.github.com"
          git add almond_cave/sent_news.json almond_cave/dynamic_radar_tickers.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update scout state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
