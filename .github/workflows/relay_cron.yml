name: 📡 Market News Relay (24/7 Unlimited)

on:
  schedule:
    # Backup 30-min watchdog cron (primary continuity is via self-chaining workflow_dispatch below)
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-news-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --quiet telethon requests pillow
      - name: Run 27-Min Continuous 60s Poll Loop
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SOURCE_CHAT_ID: ${{ secrets.SOURCE_CHAT_ID }}
          DEST_CHAT_ID: ${{ secrets.DEST_CHAT_ID }}
          OFFICIAL_SENDERS: ${{ secrets.OFFICIAL_SENDERS }}
          FILTER_RULES_B64: ${{ secrets.FILTER_RULES_B64 }}
        run: python -u almond_cave/telegram_relay/cron_relay.py --loop 27 --interval 60
      - name: Save State
        if: always()
        run: |
          git config user.name "Market Worker Bot"
          git config user.email "worker@users.noreply.github.com"
          git add almond_cave/telegram_relay/relay_state.json almond_cave/dynamic_radar_tickers.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update relay state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
      - name: Self-Chain Next 27-Min Run
        if: success() && env.GH_DISPATCH_TOKEN != ''
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: token $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/relay_cron.yml/dispatches \
            -d '{"ref":"main"}' || true
