name: 📡 Market News Relay (24/7 Unlimited)

on:
  schedule:
    # Runs every 5 min with 4x60s poll loop (~1 min latency 24/7, $0 on public repo)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-news-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --quiet telethon requests pillow
      - name: Run 60s Poll Loop Relay
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SOURCE_CHAT_ID: ${{ secrets.SOURCE_CHAT_ID }}
          DEST_CHAT_ID: ${{ secrets.DEST_CHAT_ID }}
          OFFICIAL_SENDERS: ${{ secrets.OFFICIAL_SENDERS }}
        run: python -u almond_cave/telegram_relay/cron_relay.py --loop 4 --interval 60
      - name: Save State
        run: |
          git config user.name "Market Worker Bot"
          git config user.email "worker@users.noreply.github.com"
          git add almond_cave/telegram_relay/relay_state.json almond_cave/dynamic_radar_tickers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update state [skip ci]" && git push)
